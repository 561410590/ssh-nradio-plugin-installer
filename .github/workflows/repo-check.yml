name: Repository checks

on:
  push:
  pull_request:

jobs:
  public-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public release files
        run: |
          test -f 00-current/ssh-nradio-plugin-installer.sh
          test -f 40-server-web/mayebano-support/index.html
          test -f vercel.json
          test -f README.md
          test -f CHANGELOG.md
          test -f CHECKSUMS.txt
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f .github/ISSUE_TEMPLATE/bug_report.yml

      - name: Verify C2000MAX factory partition
        run: |
          test ! -e 10-router-pages/appcenter-backup-66.1-20260427-141411
          test ! -e 10-router-pages/factory-reset-66.1-20260426-222841
          test -d 10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted
          test -f 10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted/usr/lib/lua/luci/controller/nradio_adv/appcenter.lua
          test -f 10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted/usr/lib/lua/luci/view/nradio_appcenter/appcenter.htm
          test "$(find 10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted -type f | wc -l)" -eq 4620
          ! grep -R -E 'NRadio appcenter card polish|sys_status|plugin_uninstall|appcenter-card-polish|appcenter-backup-66\.1-20260427' 10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted/usr/lib/lua/luci/controller/nradio_adv/appcenter.lua 10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted/usr/lib/lua/luci/view/nradio_appcenter/appcenter.htm
          printf '%s  %s\n' '754f54fd7502633097d30d52ac6d7b487074753d32575650d05b31bc03304fd2' '10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted/usr/lib/lua/luci/controller/nradio_adv/appcenter.lua' | sha256sum -c -
          printf '%s  %s\n' 'c7e4d540582152f1f7afde7ce604b305a48c7299cae5d18d1fa1736ff7ee2f23' '10-router-pages/factory-bin-C2000MAX-2.1.7.n0.c1-extracted/usr/lib/lua/luci/view/nradio_appcenter/appcenter.htm' | sha256sum -c -

      - name: Verify V2.0.50 script state
        run: |
          grep -q 'SCRIPT_VERSION="V2.0.50"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'SCRIPT_RELEASE_DATE="2026-05-10"' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q '测试中' 00-current/ssh-nradio-plugin-installer.sh
          grep -q "printf '3. 游戏加速器" 00-current/ssh-nradio-plugin-installer.sh
          grep -q "printf '1. 奇游联机宝" 00-current/ssh-nradio-plugin-installer.sh
          grep -q "printf '2. 雷神加速器" 00-current/ssh-nradio-plugin-installer.sh
          grep -q "printf '6. MosDNS" 00-current/ssh-nradio-plugin-installer.sh
          grep -q "printf '7. DDNS-GO" 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'install_mosdns' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'cleanup_mosdns' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'MOSDNS_VERSION' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'MosDNS 核心下载失败' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'install_ddnsgo' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'cleanup_ddnsgo' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'DDNSGO_ARCHIVE_SHA256' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'luci-i18n-ddns-go-zh-cn' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'configure_ddnsgo_web_login' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'seed_ddnsgo_config_yaml' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'ddnsgo_yaml_has_password' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'download_openlist_from_urls' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'openlist-linux-musl-arm64-lite.tar.gz' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'C2000MAX 使用存储卡临时目录' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '文件过大导致安装失败' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '$2 != "noarch"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'UNINSTALL_LOG_FILE' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'opkg_wait_unlock' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'NRadio_C8-668' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'HC-WT9108' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'NRadio_C8-688|NRadio_C2000MAX' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'NRadio_C8-688 / C2000MAX 风扇控制' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '温度来源' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'Smart 最低风速' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '过热保护温度' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '检测间隔' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'open_route = "nradioadv/system/fanctrl";' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'QIYOU_INSTALLER_SHA256' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'LEIGOD_INSTALLER_SHA256' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'verify_remote_script_sha256 "奇游入口脚本"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'verify_remote_script_sha256 "雷神官方安装脚本"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'fast_probe' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'NRadio OpenVPN Mk3: dark command-center layer' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'EOF_OPENVPN_MK3_FINAL_POLISH' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'EOF_OPENVPN_OVPN_CSS_MK3_EXACT' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'EOF_OPENVPN_LEGACY_UNUSED_CSS_OLD' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'EOF_OPENVPN_STANDARD_MODEL' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'vpn-shell-mk3' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'Mk2' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'mk2' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'MK2' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '哈基米 打开路由' 00-current/ssh-nradio-plugin-installer.sh
          grep -Fq '[ -f /tmp/qy/etc/PKG_INFO ] && cat /tmp/qy/etc/PKG_INFO || true' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'schedule_enabled' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'schedule_start' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'schedule_end' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'schedule_mode' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '定时策略' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '定时期间' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'OpenWrt 21.02.7 清华源' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '软件源: 当前不是 OpenWrt 21.02.7 清华源' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'ensure_opkg_update' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'opkg update || die "opkg update 失败"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'OpenVPN 控制台' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '目标检查' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '返回控制台' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '模板' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q '推荐动作' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q '实时校验' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q '诊断工作区' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'OEM 视图' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'priority 196' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'MosDNS SHA256 读取失败' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'dashboard_runtime' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'dashboard_stats' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'Dashboard API password' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'AdGuardHome 应用商店页已可读取本地运行态与监听' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '2>/dev/null' 00-current/ssh-nradio-plugin-installer.sh

      - name: Verify support page state
        run: |
          grep -q 'V2.0.50' 40-server-web/mayebano-support/index.html
          grep -q 'V2.0.50 已发布' 40-server-web/mayebano-support/index.html
          grep -q '脚本集成 DDNS-GO 安装' 40-server-web/mayebano-support/index.html
          grep -q 'OpenList C2000MAX 安装链降内存' 40-server-web/mayebano-support/index.html
          grep -q 'C2000MAX 安装 OpenList 时改用 lite 包' 40-server-web/mayebano-support/index.html
          grep -q '脚本新增 DDNS-GO 安装入口' 40-server-web/mayebano-support/index.html
          grep -q 'AdGuardHome 内页二次重新美化' 40-server-web/mayebano-support/index.html
          grep -q 'V2.0.40' 40-server-web/mayebano-support/index.html
          grep -q 'AdGuardHome 内页重新美化' 40-server-web/mayebano-support/index.html
          grep -q '首页打开即可直接看到 DNS 查询和拦截统计数' 40-server-web/mayebano-support/index.html
          grep -q 'V2.0.35' 40-server-web/mayebano-support/index.html
          grep -q 'MosDNS' 40-server-web/mayebano-support/index.html
          grep -q '脚本新增 MosDNS 插件' 40-server-web/mayebano-support/index.html
          grep -q 'V2.0.30' 40-server-web/mayebano-support/index.html
          grep -q '雷神卸载残留清理' 40-server-web/mayebano-support/index.html
          grep -q 'V2.0.25' 40-server-web/mayebano-support/index.html
          grep -q '应用商店美化可以恢复默认' 40-server-web/mayebano-support/index.html
          grep -q 'V2.0.20' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_C8-668' 40-server-web/mayebano-support/index.html
          grep -q 'OpenVPN 控制台界面升级' 40-server-web/mayebano-support/index.html
          grep -q 'OpenVPN 主界面删除冗余状态项' 40-server-web/mayebano-support/index.html
          grep -q '暗色控制台风格' 40-server-web/mayebano-support/index.html
          grep -q 'V2.0.15' 40-server-web/mayebano-support/index.html
          grep -q '奇游 / 雷神源切换' 40-server-web/mayebano-support/index.html
          grep -q '奇游、雷神安装前复用哈基米软件源检查流程' 40-server-web/mayebano-support/index.html
          grep -q 'OpenWrt 21.02.7 清华源' 40-server-web/mayebano-support/index.html
          grep -q 'OpenVPN 快速状态读取' 40-server-web/mayebano-support/index.html
          grep -q '安装教程' 40-server-web/mayebano-support/index.html
          grep -q '主要功能' 40-server-web/mayebano-support/index.html
          grep -q 'feature-brief' 40-server-web/mayebano-support/index.html
          grep -q 'GitHub 开源' 40-server-web/mayebano-support/index.html
          grep -q 'MobaXterm' 40-server-web/mayebano-support/index.html
          grep -q '3. 路由器在线下载' 40-server-web/mayebano-support/index.html
          grep -q 'wget -O ssh-nradio-plugin-installer.sh https://nradio.mayebano.shop/ssh-nradio-plugin-installer.sh' 40-server-web/mayebano-support/index.html
          grep -q '哈基米' 40-server-web/mayebano-support/index.html
          ! grep -q 'V2.0.5' 40-server-web/mayebano-support/index.html
          ! grep -q 'HC-WT9108' 40-server-web/mayebano-support/index.html
          ! grep -q '我的项目' 40-server-web/mayebano-support/index.html
          ! grep -q '安装方式提醒' 40-server-web/mayebano-support/index.html
          ! grep -q '电脑下载后上传' 40-server-web/mayebano-support/index.html
          ! grep -q 'SFTP' 40-server-web/mayebano-support/index.html
          ! grep -q 'data-route="A"' 40-server-web/mayebano-support/index.html
          ! grep -q 'data-route="B"' 40-server-web/mayebano-support/index.html
          ! grep -q 'ssh-nradio-plugin-installer-2.0.0beta.sh' 40-server-web/mayebano-support/index.html
          ! grep -q 'install-card' 40-server-web/mayebano-support/index.html

      - name: Verify Vercel public routes
        run: |
          grep -q '"/ssh-nradio-plugin-installer.sh"' vercel.json
          ! grep -q 'ssh-nradio-plugin-installer-2.0.0beta.sh' vercel.json

      - name: Verify checksum record
        run: |
          grep -q 'e32fc09076793822635c65e174e32caf55ab9ecf8e6f9039cccbf5ab635e188a' CHECKSUMS.txt
          grep -q '1163194  00-current/ssh-nradio-plugin-installer.sh' CHECKSUMS.txt
          grep -q 'd206161380c5c6482a62010c93d2b28c9f4f6f1f657216e969b341103d40ecc8' CHECKSUMS.txt
          grep -q '233691  40-server-web/mayebano-support/index.html' CHECKSUMS.txt
          printf '%s  %s\n' 'e32fc09076793822635c65e174e32caf55ab9ecf8e6f9039cccbf5ab635e188a' '00-current/ssh-nradio-plugin-installer.sh' | sha256sum -c -
          printf '%s  %s\n' 'd206161380c5c6482a62010c93d2b28c9f4f6f1f657216e969b341103d40ecc8' '40-server-web/mayebano-support/index.html' | sha256sum -c -

      - name: Verify license
        run: |
          grep -q 'MIT License' LICENSE
          grep -q 'Copyright (c) 2026 maye' LICENSE
          grep -q 'MIT License' README.md

      - name: Verify repository docs
        run: |
          grep -q 'V2.0.50' README.md
          grep -q 'V2.0.50' CHANGELOG.md
          grep -q 'DDNS-GO' README.md
          grep -q 'DDNS-GO' CHANGELOG.md
          grep -q 'OpenList C2000MAX' README.md
          grep -q 'OpenList lite 包' CHANGELOG.md
          grep -q 'AdGuardHome' README.md
          grep -q 'AdGuardHome' CHANGELOG.md
          grep -q 'e32fc09076793822635c65e174e32caf55ab9ecf8e6f9039cccbf5ab635e188a' README.md
          grep -q '1163194' README.md
          grep -q 'GitHub main -> Vercel Production' CONTRIBUTING.md
          grep -q 'Only the current public script is maintained' SECURITY.md
          grep -q 'Do not include router passwords' .github/ISSUE_TEMPLATE/bug_report.yml
