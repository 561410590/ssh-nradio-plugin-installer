name: Repository checks

on:
  push:
  pull_request:

jobs:
  public-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f 00-current/ssh-nradio-plugin-installer.sh
          test -f 40-server-web/mayebano-support/index.html
          test -f 40-server-web/mayebano-support/ai_studio_code.html
          test -f 40-server-web/mayebano-support/wechat-donate.png
          test -f vercel.json
          test -f README.md
          test -f CHANGELOG.md
          test -f CHECKSUMS.txt
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md

      - name: Verify V2.9.9 script state
        run: |
          grep -q 'SCRIPT_VERSION="V2.9.9"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'SCRIPT_RELEASE_DATE="2026-08-20"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'NRADIO_OPERATOR_FIX_VERSION="20260820-4"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'NR_APP_STATUS_AUTO_EXPANDED = true' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '<span>Swap 虚拟内存</span>' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'docker_payload_manifest.v1' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '/var/run/nradio-plugin-assistant.lock' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '^cleanup_openvpn_dnsmasq_domain_rules()' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'uclient-fetch 后备下载' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '^write_nradio_smart_band_script()' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '^manage_nradio_smart_band()' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '^run_nradio_smart_band_selfcheck()' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '25)' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '智能频段管理（C5800-688）' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '^state_file_is_v2()' 00-current/ssh-nradio-plugin-installer.sh
          grep -q "NRADIO_STATE_FORMAT='2'" 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'opkg update 失败，已停止' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'curl -k' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q -- '--insecure' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'wget --no-check-certificate' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'nr-openclash-fallback' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'nr-openclash-wide-css' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'window.top.location.href = "/cgi-bin/luci/admin/services/openclash/client";' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/client' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/settings' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/config-overwrite' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/config-subscribe' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/config' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/log' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'nr-openclash-oem-hidden' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'picoclaw_bin' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'picoclaw_launcher' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'picoclaw_home' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '/usr/bin/picoclaw' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '/usr/bin/picoclaw-launcher' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '/.picoclaw' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'initDebugLogAdapter' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'nr-debug-empty-hint' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'Overlay the limited ROM controller so the dashboard can read the full runtime state' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'NRadio_C2000Pro' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '^is_appcenter_v3_template()' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '直接美化应用商店，不创建事务备份或文件备份' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '不创建备份，不覆盖 /etc/config/appcenter' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'nradioadv/system/openclashfull' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'kmod-inet-diag' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'kmod-nft-tproxy' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'NRADIO_SMART_BAND_EXPECTED_SHA256' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'verify_remote_script_sha256' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'SHA256SUMS' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -Eq '[0-9a-fA-F]{64}' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -Eq '[0-9a-fA-F]{32}' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q '\.bak' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'appcenter-transaction' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'APPCENTER_TRANSACTION' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -Eq 'mkdir -p[^[:cntrl:]]*\$BACKUP_DIR|cp[^[:cntrl:]]*\$BACKUP_DIR' 00-current/ssh-nradio-plugin-installer.sh
          awk '
            /^backup_file\(\) \{/ { in_backup = 1; count++; next }
            in_backup && /^}/ { in_backup = 0; next }
            in_backup && /(^|[[:space:]])(cp|mv|mkdir|tar)[[:space:]]/ { exit 1 }
            END { if (count != 2) exit 1 }
          ' 00-current/ssh-nradio-plugin-installer.sh
          sh -n 00-current/ssh-nradio-plugin-installer.sh
          bash -n 00-current/ssh-nradio-plugin-installer.sh

      - name: Verify embedded smart band v7
        run: |
          test "$(grep -c 'EOF_NRADIO_SMART_BAND_V7' 00-current/ssh-nradio-plugin-installer.sh)" -eq 2
          awk '
            index($0, "EOF_NRADIO_SMART_BAND_V7") {
              if (capture) exit
              capture = 1
              next
            }
            capture { print }
          ' 00-current/ssh-nradio-plugin-installer.sh > /tmp/nradio-smart-band.sh
          test -s /tmp/nradio-smart-band.sh
          grep -q '智能频段切换 v7' /tmp/nradio-smart-band.sh
          grep -q 'HEALTH_FAILURE_LIMIT=3' /tmp/nradio-smart-band.sh
          grep -q 'COOLDOWN=43200' /tmp/nradio-smart-band.sh
          grep -q 'RETRY_WINDOW=86400' /tmp/nradio-smart-band.sh
          grep -q 'PREFERENCE_CONFIRM_SAMPLES=2' /tmp/nradio-smart-band.sh
          grep -q 'PREFERENCE_MAX_DAILY=2' /tmp/nradio-smart-band.sh
          grep -q 'IPv4健康，保持不切换' /tmp/nradio-smart-band.sh
          grep -q 'process "cpe" "蜂窝接口1"' /tmp/nradio-smart-band.sh
          grep -q 'process "cpe1" "蜂窝接口2"' /tmp/nradio-smart-band.sh
          sh -n /tmp/nradio-smart-band.sh

      - name: Verify support page state
        run: |
          grep -q '<title>NRadio 插件工具 V2.9.9 | 官方高级支持中心</title>' 40-server-web/mayebano-support/index.html
          grep -q 'RELEASE V2.9.9' 40-server-web/mayebano-support/index.html
          grep -q 'V2.9.9 · 2026-08-20' 40-server-web/mayebano-support/index.html
          grep -q 'GitHub Release V2.9.9' 40-server-web/mayebano-support/index.html
          grep -q '官方卡名原生优先' 40-server-web/mayebano-support/index.html
          grep -q 'Swap 状态自动展开' 40-server-web/mayebano-support/index.html
          grep -q '单一总脚本' 40-server-web/mayebano-support/index.html
          grep -q '智能频段单文件内嵌' 40-server-web/mayebano-support/index.html
          grep -q '5 &gt; 8' 40-server-web/mayebano-support/index.html
          grep -q 'role="progressbar"' 40-server-web/mayebano-support/index.html
          grep -q 'aria-current="page"' 40-server-web/mayebano-support/index.html
          grep -q 'history-toggle' 40-server-web/mayebano-support/index.html
          grep -q '复制失败，请手动选择' 40-server-web/mayebano-support/index.html
          grep -q 'prefers-reduced-motion' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_C5800-650' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_C2000MAX' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_C2000Pro' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_C2000Ultra' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_N5000' 40-server-web/mayebano-support/index.html
          ! grep -q 'NRadio_AK68-798' 40-server-web/mayebano-support/index.html
          test "$(grep -c '即将支持 · 暂未适配' 40-server-web/mayebano-support/index.html)" -eq 2
          ! grep -q 'NRadio_C2000Ultra' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'NRadio_N5000' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'C5800-650 另兼容已验证的 NROS 1.9.x，标准 OpenWrt 不适用' 40-server-web/mayebano-support/index.html
          grep -q '此工具是 SSH 脚本，不是应用商店安装包或固件包' 40-server-web/mayebano-support/index.html
          ! grep -q 'NROS 1.9 / 2.x' 40-server-web/mayebano-support/index.html
          grep -q 'grid-template-columns: repeat(5, minmax(0, 1fr));' 40-server-web/mayebano-support/index.html
          grep -q '.hero-btns .btn' 40-server-web/mayebano-support/index.html
          grep -q 'V2.8.5' 40-server-web/mayebano-support/index.html
          grep -q 'V2.8.0' 40-server-web/mayebano-support/index.html
          grep -q 'V2.7.5' 40-server-web/mayebano-support/index.html
          grep -q 'V2.7.0' 40-server-web/mayebano-support/index.html
          grep -q 'V2.6.5' 40-server-web/mayebano-support/index.html
          grep -q 'V2.6.0' 40-server-web/mayebano-support/index.html
          grep -q 'V2.5.0' 40-server-web/mayebano-support/index.html
          grep -q 'PicoClaw / 鲲鹏小龙虾' 40-server-web/mayebano-support/index.html
          grep -q '以 GitHub Release 实际页面为准' 40-server-web/mayebano-support/index.html
          ! grep -q 'ChatGPT 会员' 40-server-web/mayebano-support/index.html
          grep -q '动态 Swap' 40-server-web/mayebano-support/index.html
          grep -q '拦截保护' 40-server-web/mayebano-support/index.html
          grep -q '/_vercel/insights/script.js' 40-server-web/mayebano-support/index.html
          grep -q 'wechat-donate.png' 40-server-web/mayebano-support/index.html
          grep -q 'ssh-nradio-plugin-installer.sh' 40-server-web/mayebano-support/index.html

      - name: Verify Vercel public routes
        run: |
          grep -q '"/ssh-nradio-plugin-installer.sh"' vercel.json
          grep -q '"/00-current/ssh-nradio-plugin-installer.sh"' vercel.json
          ! grep -q 'ssh-nradio-plugin-installer-2.0.0beta.sh' vercel.json

      - name: Verify checksum record
        run: |
          grep -q 'Generated from local UTF-8 file contents on 2026-08-20' CHECKSUMS.txt
          ! grep -q '00-current/nradio-smart-band.sh' CHECKSUMS.txt
          records=0
          main_seen=0
          page_seen=0
          source_seen=0
          vercel_seen=0
          while read -r hash size path; do
            test -f "$path"
            test "$(wc -c < "$path" | tr -d ' ')" = "$size"
            printf '%s  %s\n' "$hash" "$path" | sha256sum -c -
            records=$((records + 1))
            case "$path" in
              00-current/ssh-nradio-plugin-installer.sh) main_seen=$((main_seen + 1)) ;;
              40-server-web/mayebano-support/index.html) page_seen=$((page_seen + 1)) ;;
              40-server-web/mayebano-support/ai_studio_code.html) source_seen=$((source_seen + 1)) ;;
              vercel.json) vercel_seen=$((vercel_seen + 1)) ;;
              *) exit 1 ;;
            esac
          done < <(grep -E '^[0-9a-f]{64}[[:space:]]+[0-9]+[[:space:]]+' CHECKSUMS.txt)
          test "$records" -eq 4
          test "$main_seen" -eq 1
          test "$page_seen" -eq 1
          test "$source_seen" -eq 1
          test "$vercel_seen" -eq 1

      - name: Verify repository docs
        run: |
          grep -q '当前正式版本：`V2.9.9`' README.md
          grep -q '当前公网正式版本：`V2.9.9`' README.md
          grep -q 'Repository checks 是正式发布门禁' README.md
          grep -q '## V2.9.9 更新' README.md
          grep -q '## V2.9.9 - 2026-08-20' CHANGELOG.md
          grep -q '## V2.9.8 - 2026-08-17' CHANGELOG.md
          grep -q '## V2.9.5 更新' README.md
          grep -q '## V2.9.5 - 2026-08-13' CHANGELOG.md
          grep -q 'NRadio_N5000' README.md
          grep -q 'NRadio_N5000' CHANGELOG.md
          ! grep -q 'NRadio_AK68-798' README.md
          ! grep -q 'NRadio_AK68-798' CHANGELOG.md
          grep -q 'V2.8.5' README.md
          grep -q 'V2.8.5' CHANGELOG.md
          grep -q 'V2.8.0' README.md
          grep -q 'V2.8.0' CHANGELOG.md
          grep -q 'V2.7.5' README.md
          grep -q 'V2.7.5' CHANGELOG.md
          grep -q 'V2.7.0' README.md
          grep -q 'V2.7.0' CHANGELOG.md
          grep -q 'V2.6.5' README.md
          grep -q 'V2.6.5' CHANGELOG.md
          grep -q 'V2.6.0' README.md
          grep -q 'V2.6.0' CHANGELOG.md
          grep -q 'V2.5.0' README.md
          grep -q 'V2.5.0' CHANGELOG.md
          grep -q 'V2.3.0' README.md
          grep -q 'V2.3.0' CHANGELOG.md
          grep -q 'V2.2.5' README.md
          grep -q 'V2.2.5' CHANGELOG.md
          grep -q 'V2.2.0' README.md
          grep -q 'V2.2.0' CHANGELOG.md
          grep -q 'V2.1.5' README.md
          grep -q 'V2.1.5' CHANGELOG.md
          grep -q 'PicoClaw' README.md
          grep -q 'PicoClaw' CHANGELOG.md
          grep -q 'OpenClash iframe' README.md
          grep -q 'OpenClash iframe' CHANGELOG.md
          grep -q 'nradio-smart-band.sh' README.md
          grep -q 'nradio-smart-band.sh' CHANGELOG.md
          grep -q '单一总脚本' README.md
          grep -q '不依赖旁置脚本' README.md
          main_hash="$(sha256sum 00-current/ssh-nradio-plugin-installer.sh | awk '{ print $1 }')"
          main_size="$(wc -c < 00-current/ssh-nradio-plugin-installer.sh | tr -d ' ')"
          grep -q "$main_hash" README.md
          grep -q "$main_size" README.md
