      - name: Verify checksum record
        run: |
          grep -q 'NRadio V3.3.0 release checksums' CHECKSUMS.txt
          grep -q 'Generated from local file contents on 2026-10-20' CHECKSUMS.txt
          ! grep -q '00-current/nradio-smart-band.sh' CHECKSUMS.txt || exit 1
          records=0
          main_seen=0
          page_seen=0
          ipk_seen=0
          mesh_ipk_seen=0
          ak798_ipk_seen=0
          qos_ipk_seen=0
          ak68_ssh_seen=0
          source_seen=0
          vercel_seen=0
          while read -r hash size path; do
            test -f "$path"
            test "$(wc -c < "$path" | tr -d ' ')" = "$size"
            printf '%s  %s\n' "$hash" "$path" | sha256sum -c -
            records=$((records + 1))
            case "$path" in
              00-current/ssh-nradio-plugin-installer.sh) main_seen=$((main_seen + 1)) ;;
              40-server-web/mayebano-support/index.html) page_seen=$((page_seen + 1)) ;;
              40-server-web/mayebano-support/nradio-ssh-manager.ipk) ipk_seen=$((ipk_seen + 1)) ;;
              40-server-web/mayebano-support/nradio-mesh.ipk) mesh_ipk_seen=$((mesh_ipk_seen + 1)) ;;
              40-server-web/mayebano-support/luci-app-nradio-ak798-bridge_1.2.0-5_all.ipk) ak798_ipk_seen=$((ak798_ipk_seen + 1)) ;;
              40-server-web/mayebano-support/nradio-qos-pro.ipk) qos_ipk_seen=$((qos_ipk_seen + 1)) ;;
              40-server-web/mayebano-support/AK68-798-SSH-2222.nr) ak68_ssh_seen=$((ak68_ssh_seen + 1)) ;;
              40-server-web/mayebano-support/ai_studio_code.html) source_seen=$((source_seen + 1)) ;;
              vercel.json) vercel_seen=$((vercel_seen + 1)) ;;
              *) exit 1 ;;
            esac
          done < <(grep -E '^[0-9a-f]{64}[[:space:]]+[0-9]+[[:space:]]+' CHECKSUMS.txt)
          test "$records" -eq 9
          test "$main_seen" -eq 1
          test "$page_seen" -eq 1
          test "$ipk_seen" -eq 1
          test "$mesh_ipk_seen" -eq 1
          test "$ak798_ipk_seen" -eq 1
          test "$qos_ipk_seen" -eq 1
          test "$ak68_ssh_seen" -eq 1
          test "$source_seen" -eq 1
          test "$vercel_seen" -eq 1

