name: Repository checks

on:
  push:
  pull_request:

jobs:
  public-release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f 00-current/ssh-nradio-plugin-installer.sh
          test -f 40-server-web/mayebano-support/index.html
          test -f 40-server-web/mayebano-support/ai_studio_code.html
          test -f 40-server-web/mayebano-support/wechat-donate.png
          test -f vercel.json
          test -f README.md
          test -f CHANGELOG.md
          test -f CHECKSUMS.txt
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md

      - name: Verify V2.3.0 script state
        run: |
          grep -q 'SCRIPT_VERSION="V2.3.0"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'SCRIPT_RELEASE_DATE="2026-06-13"' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'nr-openclash-fallback' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'nr-openclash-wide-css' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'window.top.location.href = "/cgi-bin/luci/admin/services/openclash/client";' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/client' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/settings' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/config-overwrite' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/config-subscribe' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/config' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'admin/services/openclash/log' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'nr-openclash-oem-hidden' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'picoclaw_bin' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'picoclaw_launcher' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'picoclaw_home' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '/usr/bin/picoclaw' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '/usr/bin/picoclaw-launcher' 00-current/ssh-nradio-plugin-installer.sh
          grep -q '/.picoclaw' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'nradioadv/system/openclashfull' 00-current/ssh-nradio-plugin-installer.sh

      - name: Verify support page state
        run: |
          grep -q '<title>NRadio 插件工具 | 官方高级支持中心</title>' 40-server-web/mayebano-support/index.html
          grep -q 'STABLE V2.3.0' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_C5800-650' 40-server-web/mayebano-support/index.html
          grep -q 'NRadio_C2000MAX' 40-server-web/mayebano-support/index.html
          grep -q 'V2.3.0 龙虾扩展盘' 40-server-web/mayebano-support/index.html
          grep -q 'PicoClaw / 鲲鹏小龙虾' 40-server-web/mayebano-support/index.html
          grep -q '暂停更新说明' 40-server-web/mayebano-support/index.html
          grep -q 'ChatGPT 会员' 40-server-web/mayebano-support/index.html
          grep -q '动态 Swap' 40-server-web/mayebano-support/index.html
          grep -q '拦截保护' 40-server-web/mayebano-support/index.html
          grep -q '/_vercel/insights/script.js' 40-server-web/mayebano-support/index.html
          grep -q 'wechat-donate.png' 40-server-web/mayebano-support/index.html
          grep -q 'ssh-nradio-plugin-installer.sh' 40-server-web/mayebano-support/index.html

      - name: Verify Vercel public routes
        run: |
          grep -q '"/ssh-nradio-plugin-installer.sh"' vercel.json
          grep -q '"/00-current/ssh-nradio-plugin-installer.sh"' vercel.json
          ! grep -q 'ssh-nradio-plugin-installer-2.0.0beta.sh' vercel.json

      - name: Verify checksum record
        run: |
          grep -q '3f912f428e44a725ed014f6a461d01661d2ded436d5fbec74a3e79e7e59b1243' CHECKSUMS.txt
          grep -q '1902378  00-current/ssh-nradio-plugin-installer.sh' CHECKSUMS.txt
          grep -q '8fd9f733ec2a8f4ab2c5e5c82a3fdeb1c09e90ab9c002d9dea7b3a0c173aa68b' CHECKSUMS.txt
          grep -q '37304  40-server-web/mayebano-support/index.html' CHECKSUMS.txt
          grep -q '096e5ba5edb548ae7bad38fd9b75880bd566f05c2966d16e9abb010a0ce926c0' CHECKSUMS.txt
          grep -q '36616  40-server-web/mayebano-support/ai_studio_code.html' CHECKSUMS.txt
          printf '%s  %s\n' '3f912f428e44a725ed014f6a461d01661d2ded436d5fbec74a3e79e7e59b1243' '00-current/ssh-nradio-plugin-installer.sh' | sha256sum -c -
          printf '%s  %s\n' '8fd9f733ec2a8f4ab2c5e5c82a3fdeb1c09e90ab9c002d9dea7b3a0c173aa68b' '40-server-web/mayebano-support/index.html' | sha256sum -c -
          printf '%s  %s\n' '096e5ba5edb548ae7bad38fd9b75880bd566f05c2966d16e9abb010a0ce926c0' '40-server-web/mayebano-support/ai_studio_code.html' | sha256sum -c -

      - name: Verify repository docs
        run: |
          grep -q 'V2.3.0' README.md
          grep -q 'V2.3.0' CHANGELOG.md
          grep -q 'V2.2.5' README.md
          grep -q 'V2.2.5' CHANGELOG.md
          grep -q 'V2.2.0' README.md
          grep -q 'V2.2.0' CHANGELOG.md
          grep -q 'V2.1.5' README.md
          grep -q 'V2.1.5' CHANGELOG.md
          grep -q 'PicoClaw' README.md
          grep -q 'PicoClaw' CHANGELOG.md
          grep -q 'OpenClash iframe' README.md
          grep -q 'OpenClash iframe' CHANGELOG.md
          grep -q '3f912f428e44a725ed014f6a461d01661d2ded436d5fbec74a3e79e7e59b1243' README.md
          grep -q '1902378' README.md
