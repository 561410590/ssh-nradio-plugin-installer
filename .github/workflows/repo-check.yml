          python3 20-tools/test_nradio_multiwan.py

      - name: Verify HNAT log reading and embedded UI syntax
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          source = Path("00-current/ssh-nradio-plugin-installer.sh").read_text(encoding="utf-8")
          functions = []
          for name in ("nradio_hwaccel_parse_hook", "nradio_hwaccel_hook_state"):
              match = re.search(r"(?ms)^" + name + r"\(\) \{\n.*?^\}", source)
              assert match, name
              functions.append(match.group(0))
          stubs = r"""
          cat() { printf '%s\n' "$RAW_HOOK"; }
          dmesg() { IFS= read -r message <&3; printf '%b\n' "$message"; }
          """
          enabled = "[3] value=1, hook is enabled now!"
          disabled = "[3] value=0, hook is disabled now!"
          cases = [
              ("1", "old", "old", "1"),
              ("0", "old", "old", "0"),
              ("", "old\nretained", "old\nretained\n" + enabled, "1"),
              ("", "old\nretained", "retained\n" + enabled, "1"),
              ("", "old\nretained", "retained\n" + disabled, "0"),
              ("", enabled, enabled, "unknown"),
              ("", "old", enabled, "unknown"),
              ("", "", disabled, "0"),
          ]
          for raw, before, after, expected in cases:
              logs = before.replace("\n", "\\n") + "\n" + after.replace("\n", "\\n")
              program = "\n".join(functions) + stubs + "\nexec 3<<'DMESG'\n" + logs + "\nDMESG\nnradio_hwaccel_hook_state\n"
              result = subprocess.run(["sh"], input=program, text=True, capture_output=True,
                                      env={**os.environ, "RAW_HOOK": raw}, check=True)
              assert result.stdout.strip() == expected, (before, after, result.stdout, expected)
          print("HNAT: 8 direct-read and log-boundary cases passed")

          for marker, quoted in (("EOF_MT5700_DUAL_UI", True), ("EOF_NRADIO_HOME_TEMPERATURE_SWITCH", False)):
              opening = "<<'" + marker + "'\n" if quoted else "<<" + marker + "\n"
              assert source.count(opening) == 1, marker
              body = source.split(opening, 1)[1].split("\n" + marker + "\n", 1)[0]
              if not quoted:
                  version = re.search(r'^NRADIO_HOME_TEMP_VERSION="([^"]+)"', source, re.M).group(1)
                  rendered = subprocess.run(["sh"], input="cat <<" + marker + "\n" + body + "\n" + marker + "\n",
                                            text=True, capture_output=True, encoding="utf-8", check=True,
                                            env={**os.environ, "NRADIO_HOME_TEMP_VERSION": version})
                  body = rendered.stdout
              subprocess.run(["node", "--check"], input=body, text=True, encoding="utf-8", check=True)
              print(marker + ": JavaScript syntax passed")
          PY

      - name: Verify independent tower monitor V10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          python3 - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          source = Path("00-current/ssh-nradio-plugin-installer.sh").read_text(encoding="utf-8")
          def payload(marker):
              opening = "<<'" + marker + "'\n"
              assert source.count(opening) == 1, marker
              return source.split(opening, 1)[1].split("\n" + marker + "\n", 1)[0]

          assert "EOF_NRADIO_SMART_BAND_V7" not in source
          assert "EOF_NRADIO_SMART_BAND_V8" not in source
          with tempfile.TemporaryDirectory() as work:
              root = Path(work)
              parts = {}
              for name in ("STATE", "MONITOR", "CONTROLLER", "INIT", "VIEW", "ICON"):
                  parts[name] = payload("EOF_NRADIO_TOWER_" + name)
                  (root / name).write_text(parts[name], encoding="utf-8")
              for name in ("STATE", "MONITOR", "CONTROLLER"):
                  subprocess.run(["luac5.1", "-p", str(root / name)], check=True)
              subprocess.run(["sh", "-n", str(root / "INIT")], check=True)
              for script in re.findall(r"<script[^>]*>(.*?)</script>", parts["VIEW"], re.S):
                  script = re.sub(r"<%.*?%>", "0", script, flags=re.S)
                  subprocess.run(["node", "--check"], input=script, text=True, encoding="utf-8", check=True)
              assert 'version="V10"' in parts["MONITOR"]
              assert "nixio.nanosleep(10)" in parts["MONITOR"]
              assert "function action_settings()" in parts["CONTROLLER"]
              assert 'save.leaf,save.post=true,true' in parts["CONTROLLER"]
              assert 'http.getenv("REQUEST_METHOD")~="POST"' in parts["CONTROLLER"]
              assert 'id="tw-periods"' in parts["VIEW"]
              assert 'id="tw-auto"' in parts["VIEW"]
              assert "基站时段监听" in parts["VIEW"] and "<svg" in parts["ICON"]
              assert not re.search(r"uci:(set|save|commit)\s*\(", parts["MONITOR"])
              assert not re.search(r"AT\+CFUN|AT\^NRFREQLOCK=", parts["MONITOR"])
              lua = r'''
          local M=dofile(arg[1])
          local s={}
          local function sample(band,t)
              local events
              s,events=M.step(s,{valid=true,band=band,backend="mt5700-at",
                  identity="sim-1",ssb="1",pci="1"},t,"test-boot")
              return events
          end
          for t=0,80,10 do sample("NR:78",t) end
          sample("NR:28",100);sample("NR:28",110)
          local events=sample("NR:28",120)
          assert(s.episode and s.episode.start==100)
          local fallback=false
          for _,e in ipairs(events) do if e.kind=="fallback" then fallback=true end end
          assert(fallback)
          for t=130,180,10 do sample("NR:78",t) end
          assert(s.episode,"must wait for 60 seconds of stable high band")
          events=sample("NR:78",190)
          local returned=false
          for _,e in ipairs(events) do if e.kind=="returned" then returned=true end end
          assert(returned and not s.episode)
          local cfg={day_start=8,day_end=22,delay_minutes=5,auto_reselect=true}
          local low={last_sample=1000,episode={start=600},current="NR:28",backend="mt5700-at"}
          assert(M.decision(low,cfg,1000,23,"2026-10-20")=="night")
          assert(M.decision(low,cfg,1000,10,"2026-10-20")=="reselect")
          cfg.auto_reselect=false
          assert(M.decision(low,cfg,1000,10,"2026-10-20")=="remind")
          cfg.auto_reselect=true;low.budget_date="2026-10-20";low.budget_count=2
          assert(M.decision(low,cfg,1000,10,"2026-10-20")=="daily_limit")
          low.budget_count=0;low.last_attempt=999
          assert(M.decision(low,cfg,1000,10,"2026-10-20")=="cooldown")
          low.gap=true
          assert(M.decision(low,cfg,1000,10,"2026-10-20")=="gap")
          '''
              subprocess.run(["lua5.1", "-", str(root / "STATE")], input=lua, text=True, check=True)
          PY

