          grep -q '^appcenter_top_nav_supported()' 00-current/ssh-nradio-plugin-installer.sh
          ! grep -q 'nradioadv/system/openclashfull' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          ! grep -q 'kmod-inet-diag' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          ! grep -q 'kmod-nft-tproxy' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          ! grep -q 'NRADIO_SMART_BAND_EXPECTED_SHA256' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          ! grep -q 'verify_remote_script_sha256' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          ! grep -q 'SHA256SUMS' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          python3 - <<'PY'
          import re
          from pathlib import Path

          source = Path("00-current/ssh-nradio-plugin-installer.sh").read_text(encoding="utf-8")
          # LuCI cache filenames are identifiers, not pinned download checksums.
          source = re.sub(r"/tmp/luci-modulecache/[0-9a-fA-F]+(?=\s|$)", "", source)
          # LuCI's anonymous RPC session is a protocol value, not a download checksum.
          source = re.sub(r"((?:L\.)?env\.sessionid \|\| )'0{32}'", r"\1''", source)
          # The bundled LuCI form.js records its upstream source commit in a comment.
          source = re.sub(r"(?m)^    # LuCI openwrt-23\.05, commit [0-9a-f]{40}\.$", "", source)
          assert not re.search(r"[0-9a-fA-F]{32,}", source), "Unexpected fixed hash outside LuCI metadata"
          # Removing OpenClash's old temporary archive does not create a backup.
          for line in source.splitlines():
              if ".bak" in line:
                  assert re.fullmatch(r"\s*rm -rf (?:/[^\s;&|<>]+ )*/tmp/openclash\.bak \|\| return 1", line), "Unexpected backup path: " + line
          PY
          ! grep -q 'appcenter-transaction' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          ! grep -q 'APPCENTER_TRANSACTION' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          ! grep -Eq 'mkdir -p[^[:cntrl:]]*\$BACKUP_DIR|cp[^[:cntrl:]]*\$BACKUP_DIR' 00-current/ssh-nradio-plugin-installer.sh || exit 1
          awk '
            /^backup_file\(\) \{/ { in_backup = 1; count++; next }
            in_backup && /^}/ { in_backup = 0; next }
            in_backup && /(^|[[:space:]])(cp|mv|mkdir|tar)[[:space:]]/ { exit 1 }
            END { if (count != 2) exit 1 }
          ' 00-current/ssh-nradio-plugin-installer.sh
          sh -n 00-current/ssh-nradio-plugin-installer.sh
          bash -n 00-current/ssh-nradio-plugin-installer.sh
          dash -n 00-current/ssh-nradio-plugin-installer.sh

      - name: Verify IPv4 and IPv6 multi-WAN integration
        run: |
          grep -q '^nradio_multiwan_install_assets()' 00-current/ssh-nradio-plugin-installer.sh
          grep -q 'record_action_history "5 > 5 > 2 > $mwui_choice"' 00-current/ssh-nradio-plugin-installer.sh
